[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "berhot-evolve-mvp"
version = "0.5.0"
description = "Autonomous open-web research exploration with separated training admission"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.2"]

[project.scripts]
evolve = "evolve.cli:main"

[tool.setuptools.packages.find]
include = ["evolve*"]
